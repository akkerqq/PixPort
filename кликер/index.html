<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Вселенная</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    height:100%; overflow:hidden;
    background:#05060f;
    color:#e8eaff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  #app {
    height:100dvh; display:flex; flex-direction:column;
    background:radial-gradient(ellipse at 50% 30%, #10143a 0%, #05060f 70%);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- Шапка ---------- */
  header {
    text-align:center; padding:10px 12px 4px;
  }
  #stageName {
    font-size:13px; letter-spacing:2px; text-transform:uppercase;
    color:#8b93ff; font-weight:700;
  }
  #energy {
    font-size:34px; font-weight:800; line-height:1.1;
    background:linear-gradient(90deg,#fff,#9db4ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #perSec { font-size:13px; color:#7c83b8; }

  /* ---------- Прогресс ---------- */
  #progressWrap { padding:6px 18px 0; }
  #progressBar {
    height:6px; background:#1a1e42; border-radius:99px; overflow:hidden;
  }
  #progressFill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#5b6bff,#b06bff);
    border-radius:99px; transition:width .3s;
  }
  #nextStage {
    font-size:11px; color:#6b71a6; text-align:right; margin-top:3px;
  }

  /* ---------- Центр / кнопка ---------- */
  #main {
    flex:1; position:relative; display:flex;
    align-items:center; justify-content:center; min-height:0;
  }
  #universe {
    position:relative; width:min(58vw,240px); height:min(58vw,240px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #glow {
    position:absolute; inset:-18%;
    background:radial-gradient(circle, rgba(120,140,255,.35) 0%, rgba(120,140,255,0) 65%);
    border-radius:50%; animation:pulse 3s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.12);opacity:1} }
  #core {
    position:relative; width:74%; height:74%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:min(24vw,100px);
    background:radial-gradient(circle at 35% 30%, #2a3170, #0b0e2a 70%);
    box-shadow:0 0 40px rgba(90,110,255,.35), inset 0 0 30px rgba(150,170,255,.15);
    transition:transform .08s;
  }
  #core:active { transform:scale(.93); }
  #universe.pop #core { animation:pop .18s; }
  @keyframes pop { 50%{transform:scale(1.07)} }

  /* всплывающие +N */
  .float {
    position:absolute; font-size:20px; font-weight:800; color:#cfd8ff;
    pointer-events:none; animation:rise 1s ease-out forwards; white-space:nowrap;
    text-shadow:0 0 8px rgba(120,140,255,.8);
  }
  @keyframes rise {
    0%{opacity:1; transform:translateY(0) scale(1)}
    100%{opacity:0; transform:translateY(-70px) scale(1.3)}
  }

  /* ---------- Магазин ---------- */
  #shop {
    height:38%; min-height:180px;
    background:#0a0c1e; border-top:1px solid #1c2150;
    display:flex; flex-direction:column;
  }
  #shopTitle {
    font-size:12px; letter-spacing:2px; text-transform:uppercase;
    color:#6b71a6; padding:8px 14px 4px;
  }
  #items { flex:1; overflow-y:auto; padding:0 10px 10px; -webkit-overflow-scrolling:touch; }
  .item {
    display:flex; align-items:center; gap:11px;
    background:#11142e; border:1px solid #1e2350;
    border-radius:12px; padding:9px 12px; margin-bottom:7px;
    transition:transform .06s;
  }
  .item:active { transform:scale(.98); }
  .item.afford { border-color:#3d47a8; background:#141944; }
  .item.locked { opacity:.45; }
  .icon { font-size:24px; width:30px; text-align:center; }
  .info { flex:1; min-width:0; }
  .name { font-size:14px; font-weight:700; }
  .desc { font-size:11px; color:#7c83b8; }
  .right { text-align:right; }
  .cost { font-size:13px; font-weight:700; color:#ffd479; }
  .lvl { font-size:11px; color:#6b71a6; }

  /* ---------- Тост ---------- */
  #toast {
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-80px);
    background:#1b2159; border:1px solid #3d47a8; color:#e8eaff;
    padding:10px 16px; border-radius:12px; font-size:13px;
    max-width:88vw; text-align:center; z-index:50; transition:transform .35s;
  }
  #toast.show { transform:translateX(-50%) translateY(0); }

  #resetBtn {
    position:absolute; top:8px; right:10px; font-size:11px;
    color:#4a4f7d; background:none; border:none; padding:6px;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div id="stageName">ПРОТОПЛАНЕТНЫЙ СГУСТОК</div>
    <div id="energy">0</div>
    <div id="perSec">+0 / сек</div>
  </header>

  <div id="progressWrap">
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="nextStage">До следующей стадии: 0</div>
  </div>

  <div id="main">
    <button id="resetBtn">сброс</button>
    <div id="universe">
      <div id="glow"></div>
      <div id="core">🌑</div>
    </div>
  </div>

  <div id="shop">
    <div id="shopTitle">Развитие</div>
    <div id="items"></div>
  </div>

</div>
<div id="toast"></div>

<script>
/* =====================================================
   ВСЕЛЕННАЯ — кликер. Все числа и стадии — здесь.
   ===================================================== */

// Стадии роста: порог = сколько всего накоплено
const STAGES = [
  { at: 0,        name: 'Протопланетный сгусток', icon: '🌑' },
  { at: 150,      name: 'Астероид',               icon: '☄️' },
  { at: 2_000,    name: 'Планета',                icon: '🪐' },
  { at: 25_000,    name: 'Газовый гигант',         icon: '🌕' },
  { at: 300_000,   name: 'Звезда',                 icon: '⭐' },
  { at: 4_000_000,  name: 'Солнечная система',      icon: '🌞' },
  { at: 60_000_000, name: 'Туманность',             icon: '🌌' },
  { at: 1_000_000_000, name: 'Галактика',           icon: '💫' },
  { at: 15_000_000_000, name: 'Вселенная',          icon: '🌀' },
];

// Апгрейды
const UPGRADES = [
  { id:'spark',  icon:'✨', name:'Искра',       desc:'+1 к силе тапа',        base:15,      growth:1.15, kind:'tapAdd',  amt:1 },
  { id:'comet',  icon:'☄️', name:'Комета',      desc:'+1 / сек',              base:100,     growth:1.15, kind:'auto',    amt:1 },
  { id:'meteor', icon:'💫', name:'Метеорит',    desc:'+8 / сек',              base:1_100,   growth:1.15, kind:'auto',    amt:8 },
  { id:'lens',   icon:'🔍', name:'Усилитель',   desc:'×2 к силе тапа',        base:3_000,   growth:1.6,  kind:'tapMul',  amt:2 },
  { id:'planet', icon:'🪐', name:'Планета-фабрика', desc:'+60 / сек',         base:14_000,  growth:1.15, kind:'auto',    amt:60 },
  { id:'star',   icon:'⭐', name:'Новый звёздный цех', desc:'+450 / сек',     base:180_000, growth:1.15, kind:'auto',    amt:450 },
  { id:'nebula', icon:'🌌', name:'Туманность',  desc:'+3 000 / сек',          base:2_500_000, growth:1.15, kind:'auto',  amt:3_000 },
  { id:'galax',  icon:'💫', name:'Галактический пресс', desc:'+25 000 / сек', base:40_000_000, growth:1.15, kind:'auto', amt:25_000 },
];

// ---------- Состояние ----------
let S = {
  energy: 0,
  total: 0,            // всего за всё время
  lvls: {},            // id -> уровень
  last: Date.now(),
};

const SAVE_KEY = 'universe_clicker_v1';

function save() { S.last = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) S = Object.assign(S, JSON.parse(raw));
  } catch(e) {}
}

// ---------- Числа ----------
function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  const units = ['K','M','B','T','Qa','Qi','Sx'];
  let i = -1;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + units[i];
}

// ---------- Расчёты ----------
function tapPower() {
  let add = 0, mul = 1;
  for (const u of UPGRADES) {
    const lv = S.lvls[u.id] || 0;
    if (!lv) continue;
    if (u.kind === 'tapAdd') add += u.amt * lv;
    if (u.kind === 'tapMul') mul *= Math.pow(u.amt, lv);
  }
  return (1 + add) * mul;
}
function autoPerSec() {
  let sum = 0;
  for (const u of UPGRADES) {
    const lv = S.lvls[u.id] || 0;
    if (lv && u.kind === 'auto') sum += u.amt * lv;
  }
  return sum;
}
function cost(u) { return Math.floor(u.base * Math.pow(u.growth, S.lvls[u.id] || 0)); }
function stageIndex() {
  let idx = 0;
  for (let i = 0; i < STAGES.length; i++) if (S.total >= STAGES[i].at) idx = i;
  return idx;
}

// ---------- Элементы ----------
const $energy = document.getElementById('energy');
const $perSec = document.getElementById('perSec');
const $stage  = document.getElementById('stageName');
const $core   = document.getElementById('core');
const $fill   = document.getElementById('progressFill');
const $next   = document.getElementById('nextStage');
const $items  = document.getElementById('items');
const $univ   = document.getElementById('universe');
const $toast  = document.getElementById('toast');

let curStage = -1;
let itemsBuilt = false;

function buildShop() {
  $items.innerHTML = '';
  for (const u of UPGRADES) {
    const el = document.createElement('div');
    el.className = 'item';
    el.id = 'item_' + u.id;
    el.innerHTML =
      `<div class="icon">${u.icon}</div>` +
      `<div class="info"><div class="name">${u.name}</div><div class="desc">${u.desc}</div></div>` +
      `<div class="right"><div class="cost">${fmt(cost(u))}</div><div class="lvl">ур. 0</div></div>`;
    el.addEventListener('click', () => buy(u));
    $items.appendChild(el);
  }
  itemsBuilt = true;
}

function refreshShop() {
  for (const u of UPGRADES) {
    const el = document.getElementById('item_' + u.id);
    if (!el) continue;
    const c = cost(u);
    const afford = S.energy >= c;
    el.classList.toggle('afford', afford);
    el.classList.toggle('locked', !afford);
    el.querySelector('.cost').textContent = fmt(c);
    el.querySelector('.lvl').textContent = 'ур. ' + (S.lvls[u.id] || 0);
  }
}

function buy(u) {
  const c = cost(u);
  if (S.energy < c) { shake(); return; }
  S.energy -= c;
  S.lvls[u.id] = (S.lvls[u.id] || 0) + 1;
  render(); save();
}

function shake() {
  $univ.animate(
    [{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],
    {duration:160}
  );
}

function toast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => $toast.classList.remove('show'), 3500);
}

// ---------- Тап ----------
function tap(e) {
  const gain = tapPower();
  S.energy += gain;
  S.total  += gain;

  $univ.classList.remove('pop');
  void $univ.offsetWidth;
  $univ.classList.add('pop');

  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = '+' + fmt(gain);
  const r = $univ.getBoundingClientRect();
  f.style.left = (30 + Math.random() * 40) + '%';
  f.style.top  = (35 + Math.random() * 20) + '%';
  $univ.appendChild(f);
  setTimeout(() => f.remove(), 1000);

  if (navigator.vibrate) navigator.vibrate(8);
  render();
}
$univ.addEventListener('pointerdown', tap);

// ---------- Отрисовка ----------
function render() {
  $energy.textContent = fmt(S.energy);
  $perSec.textContent = '+' + fmt(autoPerSec()) + ' / сек';

  const si = stageIndex();
  if (si !== curStage) {
    curStage = si;
    $stage.textContent = STAGES[si].name;
    $core.textContent = STAGES[si].icon;
    if (si > 0) toast('Новая стадия: ' + STAGES[si].name + ' ' + STAGES[si].icon);
  }

  const cur = STAGES[si].at;
  const next = STAGES[si + 1];
  if (next) {
    const p = Math.min(100, ((S.total - cur) / (next.at - cur)) * 100);
    $fill.style.width = p + '%';
    $next.textContent = 'До стадии «' + next.name + '»: ' + fmt(Math.max(0, next.at - S.total));
  } else {
    $fill.style.width = '100%';
    $next.textContent = 'Ты создал Вселенную. 🌀';
  }

  if (!itemsBuilt) buildShop();
  refreshShop();
}

// ---------- Сброс ----------
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Начать Вселенную заново? Весь прогресс исчезнет.')) {
    localStorage.removeItem(SAVE_KEY);
    S = { energy:0, total:0, lvls:{}, last:Date.now() };
    curStage = -1;
    render(); save();
  }
});

// ---------- Жизненный цикл ----------
load();

// Доход, пока не было (макс. 8 часов, 50% эффективности)
{
  const away = (Date.now() - (S.last || Date.now())) / 1000;
  if (away > 60) {
    const gain = autoPerSec() * Math.min(away, 8 * 3600) * 0.5;
    if (gain > 0) {
      S.energy += gain; S.total += gain;
      toast('Пока тебя не было, космос рос: +' + fmt(gain));
    }
  }
}

render();

// Пассивный доход
setInterval(() => {
  const a = autoPerSec();
  if (a > 0) { S.energy += a; S.total += a; render(); }
}, 1000);

// Сохранение
setInterval(save, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
